# IMPORTANT: Replace base64-encoded values with actual secrets before applying.
# Use `echo -n 'value' | base64` to encode.
# In production, use a secrets manager (e.g., HashiCorp Vault, Sealed Secrets, External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: asset-management
type: Opaque
data:
  DB_USER: cG9zdGdyZXM=                    # postgres
  DB_PASSWORD: CHANGE_ME_BASE64             # Replace with actual base64-encoded password
  LDAP_BIND_DN: CHANGE_ME_BASE64            # Replace with actual base64-encoded LDAP bind DN
  LDAP_BIND_PASSWORD: CHANGE_ME_BASE64      # Replace with actual base64-encoded LDAP password
  JWT_SECRET: CHANGE_ME_BASE64              # Replace with actual base64-encoded JWT secret
  JWT_REFRESH_SECRET: CHANGE_ME_BASE64      # Replace with actual base64-encoded refresh secret
  REDIS_PASSWORD: CHANGE_ME_BASE64          # Replace with actual base64-encoded Redis password
