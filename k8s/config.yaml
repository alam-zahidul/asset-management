apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: asset-management
type: Opaque
stringData:
  DB_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  JWT_SECRET: "CHANGE_ME_IN_PRODUCTION"
  JWT_REFRESH_SECRET: "CHANGE_ME_IN_PRODUCTION"
  REDIS_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
  LDAP_BIND_PASSWORD: "CHANGE_ME_IN_PRODUCTION"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: asset-management
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "asset_management"
  DB_USER: "postgres"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  LDAP_URL: "ldap://your-ad-server:389"
  LDAP_BASE_DN: "dc=company,dc=com"
  LDAP_BIND_DN: "cn=service-account,ou=service,dc=company,dc=com"
  LDAP_SEARCH_FILTER: "(sAMAccountName={{username}})"
  BACKEND_PORT: "3001"
  ADMIN_API_PORT: "3002"
  BACKEND_CORS_ORIGIN: "https://assets.company.com"
  ADMIN_CORS_ORIGIN: "https://assets-admin.company.com"
  NODE_ENV: "production"
  RATE_LIMIT_WINDOW_MS: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  MAX_UPLOAD_SIZE_MB: "50"
